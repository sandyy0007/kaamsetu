<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KaamSetu</title>
  <meta name="theme-color" content="#1a6b36">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --primary: #1a6b36;
      --bg: #f6f2ea;
      --card: #ffffff;
      --text: #172b1d;
      --muted: #5e7264;
      --border: #d9d4c7;
      --gold: #f5b82e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(26, 107, 54, 0.08);
      border: 1px solid var(--border);
    }
    .logo-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
    }
    .logo-wrap svg {
      width: 100%;
      height: 100%;
      border-radius: 18px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .status-box {
      background: var(--bg);
      border-radius: 16px;
      padding: 16px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(26, 107, 54, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px auto 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      margin-top: 10px;
    }
    .config-section {
      margin-top: 20px;
      text-align: left;
      display: none;
    }
    .config-section label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .config-section input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }
    .config-section input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
        <rect width="40" height="40" rx="11" fill="#1a6b36"/>
        <path d="M6 31 Q20 15 34 31" fill="none" stroke="#f3f7f2" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M6 31 H34" stroke="#f3f7f2" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M20 26 V14" stroke="#f5b82e" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M20 17 C14 17 12 12 13 9 C17 9 20 12 20 17Z" fill="#f5b82e"/>
        <path d="M20 15 C26 15 28 10 27 7 C23 7 20 10 20 15Z" fill="#fff"/>
      </svg>
    </div>
    <h1>KaamSetu</h1>
    <div class="tagline">काम से पहचान, हुनर से अवसर।</div>

    <div class="status-box" id="status-box">
      <span id="status-text">Connecting to KaamSetu service...</span>
      <div class="spinner" id="spinner"></div>
    </div>

    <button class="btn" id="retry-btn" style="display:none;" onclick="checkAndRedirect()">Retry Connection</button>
    <button class="btn btn-secondary" id="config-btn" style="display:none;" onclick="toggleConfig()">Server Settings</button>

    <div class="config-section" id="config-section">
      <label for="server-url">KaamSetu Server URL</label>
      <input type="text" id="server-url" placeholder="http://10.0.2.2:3000">
      <button class="btn" style="margin-top:10px; height:38px;" onclick="saveUrlAndConnect()">Save & Connect</button>
    </div>
  </div>

  <script src="app-config.js"></script>
  <script>
    // Server candidates:
    // 1. User manual override from in-app Server Settings (localStorage)
    // 2. Production HTTPS URL configured in app-config.js
    // 3. Android emulator loopback (10.0.2.2:3000)
    // 4. Web loopback (localhost:3000)
    const prodConfigUrl = (window.KAAMSETU_CONFIG && window.KAAMSETU_CONFIG.serverUrl)
      ? window.KAAMSETU_CONFIG.serverUrl.trim().replace(/\/+$/, "")
      : "";

    const defaultCandidates = [
      localStorage.getItem("ks_server_url"),
      prodConfigUrl || null,
      "http://10.206.43.175:3001",
      "http://10.37.193.175:3001",
      "http://172.17.2.88:3001",
      "http://10.37.193.175:3000",
      "http://172.17.2.88:3000",
      "http://10.0.2.2:3001",
      "http://10.0.2.2:3000",
      "http://localhost:3001",
      "http://localhost:3000"
    ].filter(Boolean);

    let activeCandidateIndex = 0;

    function setStatus(text, showSpinner, showRetry) {
      document.getElementById("status-text").innerText = text;
      document.getElementById("spinner").style.display = showSpinner ? "block" : "none";
      document.getElementById("retry-btn").style.display = showRetry ? "inline-flex" : "none";
      document.getElementById("config-btn").style.display = showRetry ? "inline-flex" : "none";
    }

    async function checkServer(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url + "/api/healthz", {
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        clearTimeout(timeoutId);
        return res.status === 200 || res.status === 304;
      } catch (e) {
        // Fallback check against auth/me if healthz is not available on legacy server
        try {
          const res = await fetch(url + "/api/auth/me");
          return res.status >= 200 && res.status < 500;
        } catch {
          return false;
        }
      }
    }

    async function checkAndRedirect() {
      setStatus("Connecting to KaamSetu service...", true, false);
      
      const customUrl = localStorage.getItem("ks_server_url");
      const list = customUrl ? [customUrl, ...defaultCandidates] : defaultCandidates;
      
      for (const candidate of list) {
        setStatus("Connecting to " + candidate + "...", true, false);
        const alive = await checkServer(candidate);
        if (alive) {
          setStatus("Connected! Opening KaamSetu...", true, false);
          window.location.href = candidate;
          return;
        }
      }

      setStatus("Unable to reach KaamSetu server. Ensure the backend server is running.", false, true);
    }

    function toggleConfig() {
      const sec = document.getElementById("config-section");
      sec.style.display = sec.style.display === "block" ? "none" : "block";
      const inp = document.getElementById("server-url");
      inp.value = localStorage.getItem("ks_server_url") || prodConfigUrl || "http://10.0.2.2:3000";
    }

    function saveUrlAndConnect() {
      const val = document.getElementById("server-url").value.trim().replace(/\/+$/, "");
      if (val) {
        localStorage.setItem("ks_server_url", val);
        toggleConfig();
        checkAndRedirect();
      }
    }

    // Auto-connect on load
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(checkAndRedirect, 300);
    });
  </script>
</body>
</html>
